[package]
name = "kartu-maker"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
readme = false
repository = "https://github.com/niconistal/kartu"
description = "Kartu maker tools: the MCP server that lets any AI agent build carts"

[[bin]]
name = "kartu-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
libc = "0.2"
kartu-core = { path = "../core", version = "0.1.0" }
