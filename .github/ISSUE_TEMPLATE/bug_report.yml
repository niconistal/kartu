name: Bug report
description: Something is wrong, confusing or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead? Paste the error text if there is one — every Kartu error should name a line; if it didn't, that's part of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: A command, a cart (or the smallest `main.lua` + `assets.cw` that shows it), an input script.
      render: sh
  - type: input
    id: version
    attributes:
      label: Kartu version and platform
      description: "`kartu version`, and where it ran: Linux/macOS, browser, Miyoo…"
      placeholder: kartu 0.1.0 (x86_64), Firefox on Linux
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, `kartu check` output, what you tried.
